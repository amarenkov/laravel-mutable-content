name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        db: [pgsql, mariadb]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mc_test
          POSTGRES_PASSWORD: mc_test
          POSTGRES_DB: mc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_USER: mc_test
          MARIADB_PASSWORD: mc_test
          MARIADB_DATABASE: mc_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mariadb' && 3306 || 5432 }}
      DB_DATABASE: mc_test
      DB_USERNAME: mc_test
      DB_PASSWORD: mc_test

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_mysql, intl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
